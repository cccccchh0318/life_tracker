name: life_tracker
description: 个人生活追踪 APP - 时间、任务、日程、打卡、饮食、健身

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 数据库
  sqflite: ^2.3.2
  path: ^1.9.0
  # 状态管理
  provider: ^6.1.2
  # 时间处理
  intl: ^0.19.0
  # 图标
  cupertino_icons: ^1.0.6
  # 本地通知
  flutter_local_notifications: ^17.2.2
  # 图表（健身/饮食统计）
  fl_chart: ^0.68.0
  # 导出备份
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  # UUID
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
